# The repo's whole claim is that quality lives in executable checks. Publishing
# it with nothing running those checks would make the claim decorative, so this
# runs exactly what CONTRIBUTING tells a contributor to run — no more.
#
# The suite itself is fast: ~50s for pytest, ~14s for doctor.py, measured. What
# costs money is installing ffmpeg, and on macOS that lands on a runner billed
# at 10x the Linux rate. So the split below is by COST, not by coverage:
# everything platform-independent runs on Linux for every push, and macOS runs
# on a schedule because the only thing it uniquely covers is tests/test_buildkit.py
# — seven smoke tests of the h264_videotoolbox fast path, which skip themselves
# anywhere that encoder is absent.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays, 03:00 UTC. Catches encoder or runner-image drift on the macOS
    # fast path without paying 10x for it on every docs commit.
    - cron: "0 3 * * 1"
  workflow_dispatch:
    # Run the macOS leg by hand before a release, or after touching buildkit.

jobs:
  linux:
    name: suite (ubuntu, py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor requirements.txt states and the stock python3 on
        # macOS; 3.12 catches what the floor lets through.
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: install the core deps only
        # Deliberately NOT requirements.txt. The README's headline promise is
        # that a fresh clone runs on ffmpeg plus two packages, and the only way
        # that stays true is if CI proves it on every push.
        run: python -m pip install --upgrade pip pillow numpy pytest
      - name: doctor + suite
        working-directory: skills/yiibu
        # -rs, not -q. pytest.ini already sets -q, so `pytest -q` here resolved
        # to -qq and suppressed the count line entirely: the log could not say
        # how many tests ran, nor that ten of them were not running at all.
        # tests/test_cutout.py was skipped wholesale on this leg for want of
        # cv2 and nothing in the output said so. -rs names every skip, so a
        # test that stops running has to announce itself.
        run: |
          python3 doctor.py
          python3 -m pytest -rs

  macos:
    name: suite (macos, py3.12)
    # Weekly and on demand only — see the note at the top.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: install ffmpeg
        # ffmpeg-full, not ffmpeg: Homebrew's plain formula stopped linking
        # libass, so it has no ass/subtitles filter and burns no captions. This
        # is what doctor.py tells a Mac user to install, so the instruction is
        # under test here too. Keg-only, hence GITHUB_PATH.
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: install the core deps only
        run: python -m pip install --upgrade pip pillow numpy pytest
      - name: doctor
        working-directory: skills/yiibu
        run: python3 doctor.py
      - name: pytest
        working-directory: skills/yiibu
        run: python3 -m pytest -rs
      - name: videotoolbox still on the runner
        # If test_buildkit skips here, the encoder this leg exists to exercise
        # is gone from the runner image and the leg is no longer worth its cost.
        # Its own step, run even when the suite failed: sharing a step with
        # pytest, a suite failure ended the step before this line ran while the
        # log still echoed the script, ::error:: text included, and four failed
        # weekly runs were read as "videotoolbox is gone". test_buildkit had
        # run and passed in every one of them.
        if: ${{ !cancelled() }}
        working-directory: skills/yiibu
        run: |
          python3 -m pytest tests/test_buildkit.py -q -rs | tee /tmp/bk.txt
          grep -q "no h264_videotoolbox" /tmp/bk.txt && {
            echo "::error::videotoolbox is gone from the macOS runner — this leg now proves nothing"
            exit 1
          } || true
